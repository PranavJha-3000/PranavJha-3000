<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 76" width="1000" height="76" role="img" aria-label="What I&#x27;m coding"><title>What I&#x27;m coding</title><style>@font-face{font-family:CardSerif;font-weight:400;font-style:italic;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:CardSerif;font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}.hd tspan{fill:#111111}@media (prefers-color-scheme:dark){.hd tspan{fill:#f3f3f1}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes glint{0%{opacity:0;transform:translateX(-150px) skewX(-20deg)}25%,75%{opacity:.4}100%{opacity:0;transform:translateX(470px) skewX(-20deg)}}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.gl{opacity:0;animation:glint 1.6s ease-in-out both}
